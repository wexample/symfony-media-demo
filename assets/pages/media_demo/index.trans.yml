en:
  page_title: Article
  document_title: "An article with media from the library"
  page_description: "An article linked to media from the library — a cover and attachments — picked through a form field that opens the library in a modal or panel."
  page_icon: ph:bold/images
  intro: >-
    An article pointing at media of the library through plain relations: a
    cover (ManyToOne) and attachments (ManyToMany). Its form picks them with
    symfony-media-ds's field, which opens the library page as a picker: in a
    modal for the cover, in a panel for the attachments.
  open:
    modal: Library in a modal
    panel: Library in a panel
  edit: Edit the article
  attachments: Attachments
  no_cover: No cover yet.
  wall:
    attachments: The attachments as a wall
    library: The library as a wall
    library_intro: >-
      Every image of the library, newest first, each at its own ratio: the
      next page is read from the api before the foot of the wall is reached.

fr:
  page_title: Article
  page_description: "Un article relié à des médias de la médiathèque — une couverture et des pièces jointes — choisis par un champ de formulaire qui ouvre la médiathèque en modale ou en panneau."
  page_icon: 'ph:bold/images'
  intro: 'Un article pointant vers les médias de la bibliothèque à travers des relations simples : une couverture (ManyToOne) et des pièces jointes (ManyToMany). Son formulaire les sélectionne avec le champ de symfony-media-ds, qui ouvre la page de la bibliothèque comme un sélecteur : dans une modale pour la couverture, dans un panneau pour les pièces jointes.'
  open:
    modal: 'Bibliothèque dans une modale'
    panel: 'Bibliothèque dans un panneau'
  edit: "Modifier l'article"
  attachments: 'Pièces jointes'
  no_cover: 'Pas encore de couverture.'
  wall:
    attachments: 'Les pièces jointes comme un mur'
    library: 'La bibliothèque comme un mur'
    library_intro: "Chaque image de la bibliothèque, les plus récentes en premier, chacune à son propre ratio : la page suivante est lue depuis l'api avant d'atteindre le pied du mur."

zh:
  page_title: 文章
  page_description: "一篇关联媒体库内容的文章——封面和附件——通过表单字段在模态框或面板中打开媒体库进行选择。"
  page_icon: 'ph:bold/images'
  intro: '一篇通过简单关系指向库媒体的文章：封面（多对一）和附件（多对多）。它的形式使用 symfony-media-ds 的字段选择这些内容，封面在模态框中，附件在面板中打开库页面。'
  open:
    modal: 模态框中的库
    panel: 面板中的库
  edit: 编辑文章
  attachments: 附件
  no_cover: 还没有封面。
  wall:
    attachments: 作为墙壁的附件
    library: 作为墙壁的库
    library_intro: '库中的每张图片，最新的优先，每张图片保持其比例：在到达墙底之前，从 API 读取下一页。'

ar:
  page_title: مقالة
  page_description: "مقال مرتبط بوسائط من المكتبة — صورة غلاف ومرفقات — تُختار عبر حقل نموذج يفتح المكتبة في نافذة منبثقة أو لوحة."
  page_icon: 'ph:bold/images'
  intro: 'مقال يشير إلى وسائل الإعلام في المكتبة من خلال علاقات بسيطة: غلاف (ManyToOne) والمرفقات (ManyToMany). يأخذ شكله منها باستخدام حقل symfony-media-ds، الذي يفتح صفحة المكتبة كمختار: في نافذة منبثقة للغلاف، في لوحة للمرفقات.'
  open:
    modal: 'المكتبة في نافذة منبثقة'
    panel: 'المكتبة في لوحة'
  edit: 'تحرير المقالة'
  attachments: المرفقات
  no_cover: 'لا يوجد غلاف بعد.'
  wall:
    attachments: 'المرفقات كجدار'
    library: 'المكتبة كجدار'
    library_intro: 'كل صورة من المكتبة، الأحدث أولاً، كل منها بالنسبة الخاصة بها: يتم قراءة الصفحة التالية من واجهة البرمجة قبل الوصول إلى أسفل الجدار.'

hi:
  page_title: लेख
  page_description: "लाइब्रेरी के मीडिया से जुड़ा एक लेख — कवर और अटैचमेंट — एक फ़ॉर्म फ़ील्ड से चुने जाते हैं जो लाइब्रेरी को मोडल या पैनल में खोलती है।"
  page_icon: 'ph:bold/images'
  intro: 'एक लेख जो मीडिया को सरल संबंधों के माध्यम से पुस्तकालय की ओर इशारा करता है: एक कवर (ManyToOne) और संलग्नक (ManyToMany)। इसका रूप उन्हें symfony-media-ds के क्षेत्र के साथ उठाता है, जो कवर के लिए एक मोडाल में, संलग्नकों के लिए एक पैनल में पुस्तकालय पृष्ठ खोलता है।'
  open:
    modal: 'मोडाल में पुस्तकालय'
    panel: 'पैनल में पुस्तकालय'
  edit: 'लेख संपादित करें'
  attachments: संलग्नक
  no_cover: 'अभी तक कोई कवर नहीं।'
  wall:
    attachments: 'संलग्नकों को दीवार के रूप में'
    library: 'पुस्तकालय को दीवार के रूप में'
    library_intro: 'पुस्तकालय की प्रत्येक छवि, सबसे नई पहले, प्रत्येक अपने अनुपात में: दीवार के पैर तक पहुँचने से पहले अगला पृष्ठ api से पढ़ा जाता है।'

he:
  page_title: מאמר
  page_description: "מאמר המקושר למדיה מהספרייה — תמונת שער וקבצים מצורפים — הנבחרים בשדה טופס שפותח את הספרייה בחלון מודאלי או בלוח."
  page_icon: 'ph:bold/images'
  intro: 'מאמר המפנה למדיה של הספרייה דרך קשרים פשוטים: כריכה (ManyToOne) וצירופים (ManyToMany). הצורה שלו בוחרת אותם עם השדה של symfony-media-ds, הפותח את עמוד הספרייה כמבחר: במודאל עבור הכריכה, בלוח עבור הצירופים.'
  open:
    modal: 'ספרייה במודאל'
    panel: 'ספרייה בלוח'
  edit: 'ערוך את המאמר'
  attachments: צירופים
  no_cover: 'אין כריכה עדיין.'
  wall:
    attachments: 'הצירופים כחומה'
    library: 'הספרייה כחומה'
    library_intro: 'כל תמונה של הספרייה, החדשות ביותר קודם, כל אחת ביחס שלה: הדף הבא נקרא מה-API לפני שהגענו לתחתית החומה.'

fa:
  page_title: مقاله
  page_description: "مقاله‌ای پیوندخورده به رسانه‌های کتابخانه — یک جلد و پیوست‌ها — که با فیلدی در فرم انتخاب می‌شوند که کتابخانه را در مودال یا پنل باز می‌کند."
  page_icon: 'ph:bold/images'
  intro: 'مقاله‌ای که به رسانه‌های کتابخانه از طریق روابط ساده اشاره می‌کند: یک جلد (ManyToOne) و پیوست‌ها (ManyToMany). فرم آن‌ها را با فیلد symfony-media-ds انتخاب می‌کند که صفحه کتابخانه را به عنوان یک انتخاب‌گر باز می‌کند: در یک مدال برای جلد، در یک پنل برای پیوست‌ها.'
  open:
    modal: 'کتابخانه در یک مدال'
    panel: 'کتابخانه در یک پنل'
  edit: 'ویرایش مقاله'
  attachments: پیوست‌ها
  no_cover: 'هنوز جلدی وجود ندارد.'
  wall:
    attachments: 'پیوست‌ها به عنوان یک دیوار'
    library: 'کتابخانه به عنوان یک دیوار'
    library_intro: 'هر تصویر از کتابخانه، جدیدترین اول، هرکدام با نسبت خود: صفحه بعدی قبل از رسیدن به انتهای دیوار از api خوانده می‌شود.'

ur:
  page_title: مضمون
  page_description: "لائبریری کے میڈیا سے منسلک ایک مضمون — سرورق اور منسلکات — ایک فارم فیلڈ سے چنے جاتے ہیں جو لائبریری کو موڈل یا پینل میں کھولتی ہے۔"
  page_icon: 'ph:bold/images'
  intro: 'ایک مضمون جو لائبریری کے میڈیا کی طرف اشارہ کرتا ہے سادہ تعلقات کے ذریعے: ایک سرورق (ManyToOne) اور منسلکات (ManyToMany). اس کی شکل انہیں symfony-media-ds کے میدان سے اٹھاتی ہے، جو لائبریری کے صفحے کو ایک چنندہ کے طور پر کھولتا ہے: سرورق کے لیے ایک موڈل میں، منسلکات کے لیے ایک پینل میں۔'
  open:
    modal: 'موڈل میں لائبریری'
    panel: 'پینل میں لائبریری'
  edit: 'مضمون میں ترمیم کریں'
  attachments: منسلکات
  no_cover: 'ابھی کوئی سرورق نہیں۔'
  wall:
    attachments: 'منسلکات کی دیوار'
    library: 'لائبریری کی دیوار'
    library_intro: 'لائبریری کی ہر تصویر، سب سے نئی پہلے، ہر ایک اپنے اپنے تناسب میں: دیوار کے پاؤں تک پہنچنے سے پہلے اگلا صفحہ api سے پڑھا جاتا ہے۔'

ja:
  page_title: 記事
  page_description: "ライブラリのメディアにつながった記事。カバーと添付ファイルを、ライブラリをモーダルやパネルで開くフォーム項目から選びます。"
  page_icon: 'ph:bold/images'
  intro: 'ライブラリのメディアを単純な関係を通じて指し示す記事です: カバー (ManyToOne) と添付ファイル (ManyToMany)。その形式は、カバーのためのモーダル、添付ファイルのためのパネルとしてピッカーを開くsymfony-media-dsのフィールドを使用して選択します。'
  open:
    modal: モーダルでライブラリ
    panel: パネルでライブラリ
  edit: 記事を編集
  attachments: 添付ファイル
  no_cover: カバーはまだありません。
  wall:
    attachments: 壁としての添付ファイル
    library: 壁としてのライブラリ
    library_intro: 'ライブラリのすべての画像、最新のものが最初に表示され、各画像はそれぞれの比率で表示されます: 壁の足元に達する前に次のページがAPIから読み込まれます。'

ko:
  page_title: 기사
  page_description: "라이브러리 미디어와 연결된 글 — 표지와 첨부 파일 — 을 라이브러리를 모달이나 패널로 여는 폼 필드에서 선택합니다."
  page_icon: 'ph:bold/images'
  intro: '단순한 관계를 통해 라이브러리의 미디어를 가리키는 기사: 커버(ManyToOne) 및 첨부파일(ManyToMany). 이 양식은 symfony-media-ds의 필드를 사용하여 선택하며, 커버는 모달로, 첨부파일은 패널로 라이브러리 페이지를 엽니다.'
  open:
    modal: '모달에서 라이브러리'
    panel: '패널에서 라이브러리'
  edit: '기사 수정'
  attachments: 첨부파일
  no_cover: '아직 커버가 없습니다.'
  wall:
    attachments: '벽으로서의 첨부파일'
    library: '벽으로서의 라이브러리'
    library_intro: '각각 고유 비율로 정렬된 라이브러리의 모든 이미지, 최신 이미지부터 시작: 벽의 바닥에 도달하기 전에 API에서 다음 페이지를 읽습니다.'

bn:
  page_title: লেখা
  page_description: "লাইব্রেরির মিডিয়ার সঙ্গে যুক্ত একটি নিবন্ধ — প্রচ্ছদ ও সংযুক্তি — একটি ফর্ম ফিল্ড দিয়ে বাছাই, যা লাইব্রেরি মোডাল বা প্যানেলে খোলে।"
  page_icon: 'ph:bold/images'
  intro: 'একটি লেখা লাইব্রেরির মিডিয়াকে সাধারণ সম্পর্কের মাধ্যমে নির্দেশ করে: একটি কাভার (ManyToOne) এবং সংযুক্তিগুলি (ManyToMany)। এর ফর্ম সিম্ফনি-মিডিয়া-ডিএস এর ফিল্ডের সাথে তাদের নির্বাচন করে, যা একটি পিকার হিসেবে লাইব্রেরি পৃষ্ঠা খুলে: কাভারের জন্য একটি মোডালে, সংযুক্তির জন্য একটি প্যানেলে।'
  open:
    modal: 'একটি মোডালে লাইব্রেরি'
    panel: 'একটি প্যানেলে লাইব্রেরি'
  edit: 'লেখাটি সম্পাদনা করুন'
  attachments: সংযুক্তি
  no_cover: 'এখনো কোনো কাভার নেই।'
  wall:
    attachments: 'সংযুক্তিগুলি একটি দেয়াল হিসেবে'
    library: 'লাইব্রেরিটি একটি দেয়াল হিসেবে'
    library_intro: 'লাইব্রেরির প্রতিটি ছবি, সবচেয়ে নতুন প্রথম, প্রতিটি তার নিজস্ব অনুপাত অনুযায়ী: দেয়ালের পায়ে পৌঁছানোর আগে পরবর্তী পৃষ্ঠা এপিআই থেকে পড়া হয়।'

th:
  page_title: บทความ
  page_description: "บทความที่เชื่อมกับสื่อในคลัง — ภาพปกและไฟล์แนบ — เลือกผ่านช่องฟอร์มที่เปิดคลังสื่อในโมดัลหรือแผง"
  page_icon: 'ph:bold/images'
  intro: 'บทความที่ชี้ไปที่สื่อของห้องสมุดผ่านความสัมพันธ์ที่เรียบง่าย: ปก (ManyToOne) และไฟล์แนบ (ManyToMany) ฟอร์มของมันเลือกพวกเขาด้วยฟิลด์ของ symfony-media-ds ซึ่งเปิดหน้าเพจห้องสมุดในฐานะตัวเลือก: ในโมเดลสำหรับปก, ในแผงสำหรับไฟล์แนบ.'
  open:
    modal: ห้องสมุดในโมเดล
    panel: ห้องสมุดในแผง
  edit: แก้ไขบทความ
  attachments: ไฟล์แนบ
  no_cover: ยังไม่มีปก
  wall:
    attachments: ไฟล์แนบเป็นผนัง
    library: ห้องสมุดเป็นผนัง
    library_intro: 'ภาพทุกภาพของห้องสมุด เริ่มจากใหม่ที่สุด ทุกภาพในอัตราส่วนของตัวเอง: หน้าถัดไปจะถูกอ่านจาก api ก่อนที่จะถึงปลายผนัง.'

de:
  page_title: Artikel
  page_description: "Ein Artikel, verknüpft mit Medien der Mediathek — ein Titelbild und Anhänge — ausgewählt über ein Formularfeld, das die Mediathek im Modal oder Panel öffnet."
  page_icon: 'ph:bold/images'
  intro: 'Ein Artikel, der auf Medien der Bibliothek durch einfache Beziehungen verweist: ein Cover (ManyToOne) und Anhänge (ManyToMany). Seine Form wählt sie mit dem Feld von symfony-media-ds aus, das die Bibliotheksseite als Picker öffnet: in einem Modal für das Cover, in einem Panel für die Anhänge.'
  open:
    modal: 'Bibliothek in einem Modal'
    panel: 'Bibliothek in einem Panel'
  edit: 'Artikel bearbeiten'
  attachments: Anhänge
  no_cover: 'Noch kein Cover.'
  wall:
    attachments: 'Die Anhänge als Wand'
    library: 'Die Bibliothek als Wand'
    library_intro: 'Jedes Bild der Bibliothek, das neueste zuerst, jeweils im eigenen Seitenverhältnis: die nächste Seite wird von der API gelesen, bevor das Ende der Wand erreicht ist.'

fi:
  page_title: Artikkeli
  page_description: "Artikkeli, joka on linkitetty kirjaston mediaan — kansikuva ja liitteet — valittuina lomakekentällä, joka avaa kirjaston modaalissa tai paneelissa."
  page_icon: 'ph:bold/images'
  intro: 'Artikkeli, joka osoittaa kirjaston medioihin yksinkertaisten suhteiden kautta: kansi (MoniYhteen) ja liitteet (MoniMoniin). Sen muoto valitsee ne symfony-media-ds:n kentällä, joka avaa kirjastosivun valitsimena: modaalissa kannelle, paneelissa liitteille.'
  open:
    modal: 'Kirjasto modaalissa'
    panel: 'Kirjasto paneelissa'
  edit: 'Muokkaa artikkelia'
  attachments: Liitteet
  no_cover: 'Ei kansikuvaa vielä.'
  wall:
    attachments: 'Liitteet seinänä'
    library: 'Kirjasto seinänä'
    library_intro: 'Jokainen kirjaston kuva, uusimmat ensin, jokainen omassa suhteessaan: seuraava sivu luetaan api:sta ennen kuin seinän alaosa saavutetaan.'

ru:
  page_title: Статья
  page_description: "Статья, связанная с файлами медиатеки — обложкой и вложениями, — выбранными через поле формы, открывающее медиатеку в модальном окне или панели."
  page_icon: 'ph:bold/images'
  intro: 'Статья, указывающая на медиа библиотеки через простые отношения: обложка (ManyToOne) и вложения (ManyToMany). Ее форма выбирает их с помощью поля symfony-media-ds, которое открывает страницу библиотеки как выборщик: в модальном окне для обложки, в панели для вложений.'
  open:
    modal: 'Библиотека в модальном окне'
    panel: 'Библиотека в панели'
  edit: 'Редактировать статью'
  attachments: Вложения
  no_cover: 'Обложки еще нет.'
  wall:
    attachments: 'Вложения в виде стены'
    library: 'Библиотека в виде стены'
    library_intro: 'Каждое изображение библиотеки, начиная с самых новых, каждое в своем соотношении: следующая страница читается из API, прежде чем будет достигнут нижний край стены.'

pl:
  page_title: Artykuł
  page_description: "Artykuł powiązany z mediami z biblioteki — okładką i załącznikami — wybieranymi polem formularza, które otwiera bibliotekę w oknie modalnym lub panelu."
  page_icon: 'ph:bold/images'
